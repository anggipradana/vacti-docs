<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 132" fill="none" preserveAspectRatio="xMidYMid meet" role="img" aria-label="VACTI DOCS">
  <title>VACTI DOCS</title>
  <style>
    .wm  { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #0A3D62; }
    .sfx { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #2563EB; }
    @media (prefers-color-scheme: dark) {
      .wm  { fill: #E8F0FB; }
      .sfx { fill: #8FD4FF; }
    }
  </style>

  <!-- Official VACTI brand mark (verbatim from vacti.org assets/logo.svg) -->
  <defs>
    <linearGradient id="vacti-shield" x1="60" y1="8" x2="60" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F5BD6" />
      <stop offset="1" stop-color="#0E347E" />
    </linearGradient>
    <radialGradient id="vacti-sweep" cx="60" cy="64" r="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37B6FF" stop-opacity="0.55" />
      <stop offset="1" stop-color="#37B6FF" stop-opacity="0" />
    </radialGradient>
    <clipPath id="vacti-clip"><path d="M60 8 L108 26 V64 C108 95 88 116 60 126 C32 116 12 95 12 64 V26 Z" /></clipPath>
  </defs>
  <path d="M60 8 L108 26 V64 C108 95 88 116 60 126 C32 116 12 95 12 64 V26 Z" fill="url(#vacti-shield)" />
  <g clip-path="url(#vacti-clip)">
    <path d="M60 64 L112 30 L120 70 L96 104 Z" fill="url(#vacti-sweep)" />
    <g stroke="#FFFFFF" stroke-width="2.2" fill="none" opacity="0.4">
      <circle cx="60" cy="64" r="18" />
      <circle cx="60" cy="64" r="36" />
    </g>
    <path d="M60 64 L104 34" stroke="#8FD4FF" stroke-width="3.2" stroke-linecap="round" />
  </g>
  <circle cx="60" cy="64" r="5" fill="#FFFFFF" />
  <circle cx="40" cy="48" r="3.6" fill="#FFFFFF" opacity="0.8" />
  <circle cx="78" cy="86" r="3.6" fill="#FFFFFF" opacity="0.8" />
  <circle cx="86" cy="50" r="6" fill="#FF5A5A" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- Wordmark: same Inter 800 / 0.14em / navy lockup used on vacti.org -->
  <text class="wm" x="132" y="85" font-size="58" letter-spacing="8.1">VACTI</text>
  <!-- DOCS suffix: same Inter 800, smaller, letter-spaced, palette accent -->
  <text class="sfx" x="378" y="85" font-size="34" letter-spacing="5.4">DOCS</text>
</svg>
